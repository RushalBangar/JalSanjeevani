<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | JalSanjeevani</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/login.css">
  
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- Background Nav just for logo -->
  <nav style="position: absolute; background: transparent; border: none;">
    <div class="logo">
      <img src="assets/logo.jpg" alt="JalSanjeevani Logo" style="height: 48px; border-radius: 6px;">
    </div>
  </nav>

  <div class="login-container">
    <div class="login-card glass-panel">
      
      <div class="login-header">
        <h2>Secure Portal</h2>
        <p>Sign in to access your dashboard</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="user@jalsanjeevani.gov.in" required>
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      </form>

      <a href="index.html" class="back-link">← Back to Project Info</a>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
