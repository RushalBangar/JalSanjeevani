<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driver App | JalSanjeevani</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/mobile.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="mobile-layout">

  <header class="mobile-header">
    <h2>Active Dispatch</h2>
    <span class="user-badge">Tanker #04</span>
  </header>

  <main class="mobile-content">
    
    <div class="manifest-card glass-panel">
      <h3>Target: Khopadi Village</h3>
      <div class="detail-row">
        <span>Load Volume</span>
        <span>10,000 Liters</span>
      </div>
      <div class="detail-row">
        <span>Required Handshake</span>
        <span>Gram Panchayat Sec.</span>
      </div>
    </div>

    <p class="qr-instructions">Present this encrypted QR code to the village official upon discharge.</p>

    <div class="qr-container" id="qrcode">
      <!-- QR code generated by JS goes here -->
    </div>

    <button id="btnArrived" class="btn btn-primary btn-block">Log Arrival Coordinates</button>
    <br><br>
    <a href="index.html" class="btn btn-outline btn-block" style="text-align: center;">Logout</a>

  </main>

  <script src="js/driver.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
